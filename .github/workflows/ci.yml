name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck, lint, assets, tests and production build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload visual validation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-validation-reports
          if-no-files-found: ignore
          path: |
            assets/generated/object-cleanup-report.json
            assets/generated/object-cleanup-check.json
            public/assets/characters/character-atlas-manifest.json
